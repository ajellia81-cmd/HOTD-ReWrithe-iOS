; The Ragdoll mod (built into the game; docs/modding.md). This file is its manifest: the name, the help line and the
; settings the Mods page shows. The code is the game's own (type = ragdoll): you can change the texts, the defaults
; and the order of the choices here, not what the choices do.
[mod]
name = Ragdoll
author = ReWrithe
version = 2
description = Dead creatures fall as ragdolls; your shots push the bodies along the floor (visual only)
type = ragdoll
default = off

[settings]
; key = label | default | choice, choice, ... | help line
friction = Friction | Normal | Rough, Normal, Smooth | How quickly a pushed body stops sliding (Rough: soon, Smooth: further)
stay = Bodies Stay | 8 s | Arcade, 4 s, 8 s, 15 s, 30 s | How long a body stays after the arcade would remove it
gravity = Gravity | Normal | Low, Normal, Heavy | How fast the bodies fall
gore = Dismemberment | On | On, Off | Off: no heads or limbs come off, the bodies stay whole (a mod setting: visual only)
