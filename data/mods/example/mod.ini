; An example mod (docs/modding.md): a texture pack without pictures, only colour rules. Copy this folder, rename it,
; change the lines below. Turn it on in Options > Mods (it is off until you do: default = off).
[mod]
name = Example: Green Blood
author = ReWrithe
version = 1
description = An example texture-pack mod: green blood by colour rules (copy this folder to make your own)
type = textures
default = off
models = both
; how this mod's models and pictures hide each other (docs/modding.md "Depth"): auto (custom models per pixel, pictures
; on the game's models as the game draws them), sort (the arcade's polygon sort) or buffer (per pixel)
depth = auto

[recolour]
; the blood colour (as Blood Color: Custom)
blood = #30C040
; the arcade's textures drawn in the blood colour (palette entry 1023), tinted green
*-c1023 = tint #30C040
