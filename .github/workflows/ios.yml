# iOS build (docs/ios.md): the iPhone / iPad app as an unsigned .ipa for LiveContainer or another sideloading tool.
# Runs on a push to "main" / "ios", on a version tag, or by hand (Actions -> ios -> Run workflow).
# The .ipa itself (no zip around it) goes to the release "latest", always under the same name, so one link is always
# the newest build:
#   https://github.com/<owner>/<repo>/releases/download/latest/HOTD-ReWrithe-iOS.ipa
# NO GAME DATA is used or packaged.
name: ios

on:
  push:
    branches: ["ios", "main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # (the release "latest")

jobs:
  ios:
    name: iOS (arm64, unsigned)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version && cmake --version
      - name: Build and package
        run: bash ios/build.sh
      - name: Publish the .ipa (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ipa="$(ls build-ios/ipa/*.ipa | head -1)"
          cp "$ipa" build-ios/ipa/HOTD-ReWrithe-iOS.ipa
          notes="Newest iOS build: commit ${GITHUB_SHA::7} ($(basename "$ipa")). Install with LiveContainer (+ -> this .ipa). Your own game files go into the app's Documents folder (docs/ios.md)."
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title "iOS (newest build)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit latest --notes "$notes"
          fi
          gh release upload latest build-ios/ipa/HOTD-ReWrithe-iOS.ipa --clobber
          echo "### [HOTD-ReWrithe-iOS.ipa](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/HOTD-ReWrithe-iOS.ipa)" >> "$GITHUB_STEP_SUMMARY"
